name: trigger-workflow

on:
  push:
    branches: [main, 'feature/**']
    paths: ['src/**', 'scripts/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'               # Every Monday at 9 AM UTC
  workflow_dispatch:                   # Manual trigger (Topic 20)
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]
      run_tests:
        description: 'Run test suite?'
        required: false
        type: boolean
        default: true
