name: Cohack Journey

on: push

jobs:

  hello-world:
    runs-on: ubuntu-latest
    steps:
      -  name: Say Hello BN
         run: echo "Hello from GH-200 session! Lets create some great workflow files"

      -  name:  Checkout Repo
         uses: actions/Checkout@v6

      -  name: list files
         run: ls -la 
      -  name: Generate ASCII Artwork
         run:
           sudo apt-get install -y figlet
           figlet "GH-200 CoHack"
           echo "-------------------------------"
           figlet -f slant "GitHub Actions"
           echo "ASCII artwork generated using figlet!"
